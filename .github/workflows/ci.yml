name: CI

# Runs on every pull request (and pushes to main) to compile the project,
# run unit + integration/API tests, and enforce a minimum Jacoco coverage bar.
on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-test-coverage:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: mvn -B compile

      - name: Run unit + integration + API (WireMock/REST Assured) tests
        run: mvn -B test

      - name: Enforce Jacoco coverage threshold
        run: mvn -B verify -DskipTests

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

      - name: Package runnable jar
        run: mvn -B package -DskipTests

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-cli-jar
          path: target/finance-tracker-cli.jar